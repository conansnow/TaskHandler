name: Bug report
description: Something the library does that it should not
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For anything that looks exploitable, please use the Security tab
        instead. See SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: >
        The smallest program that shows it. A test case in the shape of
        tests/task_handler_test.cc is ideal. If it only reproduces sometimes,
        say roughly how often.
      render: c++
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Release or commit, from TASKHANDLER_VERSION_STRING or git.
      placeholder: 0.2.0
    validations:
      required: true

  - type: dropdown
    id: consumption
    attributes:
      label: How the library is consumed
      options:
        - Header-only (TaskHandler::header_only)
        - Compiled, shared (TaskHandler::task_handler, BUILD_SHARED_LIBS=ON)
        - Compiled, static (TaskHandler::task_handler)
        - Something else, described above
    validations:
      required: true

  - type: input
    id: toolchain
    attributes:
      label: Platform and toolchain
      placeholder: Ubuntu 24.04, GCC 13.3, C++17, Debug
    validations:
      required: true

  - type: textarea
    id: sanitizers
    attributes:
      label: Sanitizer output
      description: >
        Optional, but the fastest route to a fix. Build with the asan or tsan
        preset and paste what it reports.
      render: text
