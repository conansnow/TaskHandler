name: Set up vcpkg
description: >
  Install CMake 4.4.3, bootstrap vcpkg, restore its binary cache from
  actions/cache, and put MSVC on PATH on Windows so the Ninja presets
  can find cl.exe.

runs:
  using: composite
  steps:
    # ubuntu-latest still ships CMake 3.28; the project requires 4.0.
    # Pin the patch so a PyPI upload cannot silently change the job.
    - name: Install CMake 4.4.3
      shell: bash
      run: |
        PY=python3
        command -v python3 >/dev/null 2>&1 || PY=python
        "$PY" -m pip install --user 'cmake==4.4.3'
        CMAKE_BIN="$("$PY" -c 'import cmake, pathlib; print(pathlib.Path(cmake.CMAKE_BIN_DIR))')"
        echo "$CMAKE_BIN" >> "$GITHUB_PATH"
        "$CMAKE_BIN/cmake" --version

    - name: Set up vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: vcpkg.json

    # run-vcpkg still defaults to the removed x-gha backend when
    # VCPKG_BINARY_SOURCES is unset. Even if the workflow already set
    # it, rewrite it to the files provider at the directory run-vcpkg
    # just created, so a later cmake --preset cannot pick x-gha back up.
    - name: Point vcpkg at the files cache
      shell: bash
      run: |
        echo "VCPKG_BINARY_SOURCES=clear;files,${VCPKG_DEFAULT_BINARY_CACHE},readwrite" >> "$GITHUB_ENV"

    - name: Restore vcpkg binary cache
      uses: actions/cache@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ runner.arch }}-

    # vcpkg finds MSVC through vswhere. CMake's Ninja generator does not:
    # it needs cl.exe on PATH, which a stock windows-latest runner does
    # not provide.
    - name: Enable MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
