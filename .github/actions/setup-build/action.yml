name: Set up vcpkg
description: >
  Check CMake is at least 3.28, bootstrap vcpkg, restore its binary cache from
  actions/cache, and put MSVC on PATH on Windows so the Ninja presets
  can find cl.exe.

runs:
  using: composite
  steps:
    # The project floor is CMake 3.28 (CMAKE_CXX_SCAN_FOR_MODULES). Runners
    # already ship that or newer; do not pip-install an unhashed wheel.
    - name: Check CMake
      shell: bash
      run: cmake --version

    - name: Set up vcpkg
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
      with:
        vcpkgJsonGlob: vcpkg.json

    # run-vcpkg still defaults to the removed x-gha backend when
    # VCPKG_BINARY_SOURCES is unset. Even if the workflow already set
    # it, rewrite it to the files provider at the directory run-vcpkg
    # just created, so a later cmake --preset cannot pick x-gha back up.
    - name: Point vcpkg at the files cache
      shell: bash
      run: |
        echo "VCPKG_BINARY_SOURCES=clear;files,${VCPKG_DEFAULT_BINARY_CACHE},readwrite" >> "$GITHUB_ENV"

    - name: Restore vcpkg binary cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ runner.arch }}-

    # vcpkg finds MSVC through vswhere. CMake's Ninja generator does not:
    # it needs cl.exe on PATH, which a stock windows-latest runner does
    # not provide.
    - name: Enable MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@7defe9254715b088f12dddd9942945a3d75cdad5 # v1.9.0
