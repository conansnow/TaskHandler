name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_DISABLE_METRICS: "1"
  # run-vcpkg defaults to clear;x-gha,readwrite. GitHub no longer
  # exposes ACTIONS_CACHE_URL, and vcpkg removed that backend, so
  # every job that needed GoogleTest died in configure. "default"
  # is the files provider; setup-build then caches that directory.
  VCPKG_BINARY_SOURCES: "default"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc-debug
            os: ubuntu-latest
            preset: debug
          - name: linux-gcc-release
            os: ubuntu-latest
            preset: release
          - name: linux-gcc-static
            os: ubuntu-latest
            preset: static
          - name: linux-clang-debug
            os: ubuntu-latest
            preset: debug
            cc: clang
            cxx: clang++
          # The presets turn warnings into errors, which is wanted on the
          # compilers the project is developed against. AppleClang and MSVC
          # warn about different things, so they build without it rather than
          # failing the matrix over a diagnostic nobody has looked at yet.
          - name: macos-clang-debug
            os: macos-latest
            preset: debug
            extra: -DTASKHANDLER_WARNINGS_AS_ERRORS=OFF
          - name: macos-clang-release
            os: macos-latest
            preset: release
            extra: -DTASKHANDLER_WARNINGS_AS_ERRORS=OFF
          - name: windows-msvc-debug
            os: windows-latest
            preset: debug
            extra: -DTASKHANDLER_WARNINGS_AS_ERRORS=OFF
          - name: windows-msvc-static
            os: windows-latest
            preset: static
            extra: -DTASKHANDLER_WARNINGS_AS_ERRORS=OFF

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up vcpkg
        uses: ./.github/actions/setup-build

      - name: Select compiler
        if: matrix.cc != ''
        shell: bash
        run: |
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} ${{ matrix.extra }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # A smoke run rather than a measurement: CI runners are far too noisy for
      # the numbers to mean anything, but a benchmark that no longer runs is
      # worse than no benchmark at all.
      - name: Run benchmarks
        if: matrix.name == 'linux-gcc-release'
        run: ./out/build/release/benchmarks/task_handler_benchmark

  # The library promises C++23, but consumers are free to be newer than that,
  # and a deprecation or a changed overload set breaks them rather than us.
  # Clang is used because GCC 13 on ubuntu-latest still rejects -std=c++26.
  standards:
    name: c++${{ matrix.standard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        standard: [26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up vcpkg
        uses: ./.github/actions/setup-build

      - name: Select compiler
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset debug -DCMAKE_CXX_STANDARD=${{ matrix.standard }}

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: ctest --preset debug

  # The checks that matter most for a threading library, and the reason the
  # asan and tsan presets exist.
  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan
            preset: asan
          - name: tsan
            preset: tsan
          - name: asan-clang
            preset: asan
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up vcpkg
        uses: ./.github/actions/setup-build

      - name: Select compiler
        if: matrix.cc != ''
        shell: bash
        run: |
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          TSAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --preset ${{ matrix.preset }}

  # Threading bugs are timing-dependent, so a single green run proves less than
  # it does elsewhere.
  repeat:
    name: repeat under tsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up vcpkg
        uses: ./.github/actions/setup-build

      - name: Configure
        run: cmake --preset tsan

      - name: Build
        run: cmake --build --preset tsan

      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --preset tsan --repeat until-fail:20

  # Proves that the ways the README tells people to depend on TaskHandler
  # actually work, for both exported targets. A build-tree-only check would not
  # have caught the installed header-only target being exported under the wrong
  # name. pkg-config, the vcpkg overlay and Conan 2 run on Ubuntu; macOS still
  # covers find_package and FetchContent.
  consume:
    name: install and consume (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
            extra: -DTASKHANDLER_WARNINGS_AS_ERRORS=OFF

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up vcpkg
        uses: ./.github/actions/setup-build

      - name: Build and install
        run: |
          cmake --preset release ${{ matrix.extra }}
          cmake --build --preset release
          cmake --install out/build/release

      - name: Consume via find_package
        run: |
          cmake -S ci/consumer -B out/consumer-find-package -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/out/install/release"
          cmake --build out/consumer-find-package
          ./out/consumer-find-package/consumer_compiled
          ./out/consumer-find-package/consumer_header_only

      # FETCHCONTENT_SOURCE_DIR points the declared dependency at this
      # checkout, so the job tests the tree it was run against instead of
      # fetching the tag. This covers add_subdirectory() too.
      - name: Consume as a subproject
        run: |
          cmake -S ci/consumer -B out/consumer-fetchcontent -G Ninja \
            -DTASKHANDLER_CONSUMER_MODE=fetchcontent \
            -DFETCHCONTENT_SOURCE_DIR_TASKHANDLER="$PWD"
          cmake --build out/consumer-fetchcontent
          ./out/consumer-fetchcontent/consumer_compiled
          ./out/consumer-fetchcontent/consumer_header_only

      - name: Consume via pkg-config
        if: matrix.os == 'ubuntu-latest'
        run: |
          pcdir=$(find out/install/release -type d -name pkgconfig | head -n 1)
          if [ -z "$pcdir" ]; then
            echo "no pkgconfig directory under out/install/release" >&2
            exit 1
          fi
          export PKG_CONFIG_PATH="$pcdir${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          pkg-config --exists --print-errors taskhandler
          pkg-config --exists --print-errors taskhandler-header-only
          pkg-config --cflags --libs taskhandler
          pkg-config --cflags --libs taskhandler-header-only
          cmake -S ci/consumer -B out/consumer-pkgconfig -G Ninja \
            -DTASKHANDLER_CONSUMER_MODE=pkgconfig
          cmake --build out/consumer-pkgconfig
          libdir=$(pkg-config --variable=libdir taskhandler)
          export LD_LIBRARY_PATH="$libdir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ./out/consumer-pkgconfig/consumer_compiled
          ./out/consumer-pkgconfig/consumer_header_only

      - name: Consume via vcpkg overlay
        if: matrix.os == 'ubuntu-latest'
        run: |
          case "$(uname -m)" in
            x86_64) TRIPLET=x64-linux ;;
            aarch64) TRIPLET=arm64-linux ;;
            *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
          esac
          "$VCPKG_ROOT/vcpkg" install taskhandler \
            --overlay-ports="$PWD/ports" \
            --triplet "$TRIPLET" \
            --classic \
            --x-install-root="$PWD/out/vcpkg-installed"
          cmake -S ci/consumer -B out/consumer-vcpkg -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/out/vcpkg-installed/$TRIPLET"
          cmake --build out/consumer-vcpkg
          ./out/consumer-vcpkg/consumer_compiled
          ./out/consumer-vcpkg/consumer_header_only

      - name: Consume via Conan 2
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 -m pip install --user "conan>=2.0.14,<3"
          export PATH="$HOME/.local/bin:$PATH"
          conan profile detect --force
          conan create . --version=0.3.0 -s compiler.cppstd=23

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned: clang-format's output drifts between major versions, so an
      # unpinned runner upgrade would fail this job on untouched code.
      # llvm.sh is checksummed in ci/install-llvm-tools.sh because it runs
      # as root.
      - name: Install clang-format
        run: ci/install-llvm-tools.sh clang-format-23

      # Driven off git rather than a list of directories, so a source file in a
      # directory nobody remembered to add here cannot escape the check.
      - name: Check formatting
        run: |
          clang-format-23 --version
          clang-format-23 --dry-run --Werror $(git ls-files '*.h' '*.cc')

  tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up vcpkg
        uses: ./.github/actions/setup-build

      # clang picks the newest GCC installation it can find and then needs that
      # GCC's libstdc++ headers, which are not installed on the runner by
      # default. Without this, every include resolves to "file not found" and
      # the results are meaningless rather than merely wrong.
      - name: Install clang-tidy
        run: ci/install-llvm-tools.sh clang-tidy-23 libstdc++-14-dev

      - name: Configure
        run: cmake --preset debug

      # The test file is excluded on purpose: its findings are almost entirely
      # GoogleTest macro expansion, and analysing it takes minutes.
      #
      # --warnings-as-errors because clang-tidy exits 0 on warnings, so without
      # it this job only ever caught a translation unit that would not compile.
      - name: Run clang-tidy
        run: |
          clang-tidy-23 --version
          clang-tidy-23 -p out/build/debug --warnings-as-errors='*' \
            src/task_handler.cc src/thread_pool.cc examples/basic.cc \
            examples/thread_pool.cc benchmarks/task_handler_benchmark.cc
