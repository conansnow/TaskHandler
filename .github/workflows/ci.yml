name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_DISABLE_METRICS: "1"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc-debug
            os: ubuntu-latest
            preset: debug
          - name: linux-gcc-release
            os: ubuntu-latest
            preset: release
          - name: linux-gcc-static
            os: ubuntu-latest
            preset: static
          - name: linux-clang-debug
            os: ubuntu-latest
            preset: debug
            cc: clang
            cxx: clang++
          # The presets turn warnings into errors, which is wanted on the
          # compilers the project is developed against. AppleClang and MSVC
          # warn about different things, so they build without it rather than
          # failing the matrix over a diagnostic nobody has looked at yet.
          - name: macos-clang-debug
            os: macos-latest
            preset: debug
            extra: -DTASKHANDLER_WARNINGS_AS_ERRORS=OFF
          - name: windows-msvc-debug
            os: windows-latest
            preset: debug
            extra: -DTASKHANDLER_WARNINGS_AS_ERRORS=OFF
          - name: windows-msvc-static
            os: windows-latest
            preset: static
            extra: -DTASKHANDLER_WARNINGS_AS_ERRORS=OFF

    steps:
      - uses: actions/checkout@v4

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json

      - name: Select compiler
        if: matrix.cc != ''
        shell: bash
        run: |
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} ${{ matrix.extra }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # The checks that matter most for a threading library, and the reason the
  # asan and tsan presets exist.
  sanitizers:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan]

    steps:
      - uses: actions/checkout@v4

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          TSAN_OPTIONS: halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --preset ${{ matrix.preset }}

  # Threading bugs are timing-dependent, so a single green run proves less than
  # it does elsewhere.
  repeat:
    name: repeat under tsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json

      - name: Configure
        run: cmake --preset tsan

      - name: Build
        run: cmake --build --preset tsan

      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --preset tsan --repeat until-fail:20

  # Proves that find_package(TaskHandler) works against a real install tree,
  # for both exported targets. A build-tree-only check would not have caught
  # the installed header-only target being exported under the wrong name.
  install:
    name: install and consume
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json

      - name: Build and install
        run: |
          cmake --preset release
          cmake --build --preset release
          cmake --install out/build/release

      - name: Consume via find_package
        run: |
          cmake -S ci/consumer -B out/consumer -G Ninja \
            -DCMAKE_PREFIX_PATH="$PWD/out/install/release"
          cmake --build out/consumer
          ./out/consumer/consumer_compiled
          ./out/consumer/consumer_header_only

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned: clang-format's output drifts between major versions, so an
      # unpinned runner upgrade would fail this job on untouched code.
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: |
          clang-format-18 --version
          clang-format-18 --dry-run --Werror \
            include/conan/*.h src/*.cc tests/*.cc examples/*.cc

  tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json

      # clang picks the newest GCC installation it can find and then needs that
      # GCC's libstdc++ headers, which are not installed on the runner by
      # default. Without this, every include resolves to "file not found" and
      # the results are meaningless rather than merely wrong.
      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-18 libstdc++-14-dev

      - name: Configure
        run: cmake --preset debug

      # The test file is excluded on purpose: its findings are almost entirely
      # GoogleTest macro expansion, and analysing it takes minutes.
      - name: Run clang-tidy
        run: |
          clang-tidy-18 --version
          clang-tidy-18 -p out/build/debug src/task_handler.cc examples/basic.cc
